apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: trivy-operator
rules:
  - apiGroups: [""]
    resources:
      - "configmaps"
      - "pods"
      - "secrets"
      - "services"
      - "serviceaccounts"
      - "events"
    verbs:
      - "get"
      - "list"
      - "watch"
      - "create"
      - "update"
      - "patch"
  - apiGroups: ["apps"]
    resources:
      - "daemonsets"
      - "deployments"
      - "replicasets"
      - "statefulsets"
    verbs:
      - "get"
      - "list"
      - "watch"
  - apiGroups: ["batch"]
    resources:
      - "cronjobs"
      - "jobs"
    verbs:
      - "get"
      - "list"
      - "watch"
      - "create"
      - "delete"
  - apiGroups: ["aquasecurity.github.io"]
    resources:
      - "vulnerabilityreports"
      - "configauditreports"
      - "clusterconfigauditreports"
      - "clustercompliancereports"
      - "rbacassessmentreports"
      - "exposedsecretreports"
      - "infraassessmentreports"
    verbs:
      - "get"
      - "list"
      - "watch"
      - "create"
      - "update"
      - "patch"
      - "delete"
  - apiGroups: [""]
    resources:
      - "namespaces"
    verbs:
      - "get"
      - "list"
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ArgoCD Applications must be deployed to the argocd namespace
namespace: argocd

resources:
  - namespace.yaml
  - prometheus-crds-application.yaml
  - monitoring-application.yaml
  - api-application.yaml
  - keycloak-application.yaml
  - ngnix-application.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: trivy-operator
  labels:
    app: trivy-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: trivy-operator  # Referencia al ClusterRole
subjects:
  - kind: ServiceAccount
    name: trivy-operator  # La cuenta que recibe los permisos
    namespace: trivy  # Namespace donde vive la cuenta
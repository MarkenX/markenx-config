apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: trivy-operator
  labels:
    app: trivy-operator
rules:
  # Regla 1: Leer y observar recursos del cluster
  - apiGroups: [""]  # Grupo de API core (v1)
    resources: ["pods", "replicationcontrollers", "services"]
    verbs: ["get", "list", "watch"]

  # Regla 2: Leer recursos de apps y batch (Deployments, Jobs, etc.)
  - apiGroups: ["apps", "batch"]
    resources: ["deployments", "daemonsets", "statefulsets", "replicasets", "jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]

  # Regla 3: Gestionar los Custom Resources propios (CRUD de reportes)
  - apiGroups: ["aquasecurity.github.io"]
    resources: ["vulnerabilityreports", "configauditreports"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Regla 4: Ver namespaces
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
---
# VulnerabilityReport CRD - Reports container image vulnerabilities
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vulnerabilityreports.aquasecurity.github.io
  labels:
    app.kubernetes.io/name: trivy-operator
spec:
  group: aquasecurity.github.io
  names:
    kind: VulnerabilityReport
    listKind: VulnerabilityReportList
    plural: vulnerabilityreports
    shortNames:
      - vuln
      - vulns
    singular: vulnerabilityreport
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Repository
          type: string
          jsonPath: .report.artifact.repository
        - name: Tag
          type: string
          jsonPath: .report.artifact.tag
        - name: Scanner
          type: string
          jsonPath: .report.scanner.name
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
        - name: Critical
          type: integer
          jsonPath: .report.summary.criticalCount
          priority: 1
        - name: High
          type: integer
          jsonPath: .report.summary.highCount
          priority: 1
        - name: Medium
          type: integer
          jsonPath: .report.summary.mediumCount
          priority: 1
        - name: Low
          type: integer
          jsonPath: .report.summary.lowCount
          priority: 1
      schema:
        openAPIV3Schema:
          type: object
          required:
            - apiVersion
            - kind
            - metadata
            - report
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            report:
              type: object
              required:
                - artifact
                - scanner
                - summary
                - updateTimestamp
                - vulnerabilities
              properties:
                artifact:
                  type: object
                  properties:
                    repository:
                      type: string
                    tag:
                      type: string
                    digest:
                      type: string
                    mimeType:
                      type: string
                registry:
                  type: object
                  properties:
                    server:
                      type: string
                scanner:
                  type: object
                  required:
                    - name
                    - vendor
                    - version
                  properties:
                    name:
                      type: string
                    vendor:
                      type: string
                    version:
                      type: string
                summary:
                  type: object
                  required:
                    - criticalCount
                    - highCount
                    - lowCount
                    - mediumCount
                    - noneCount
                    - unknownCount
                  properties:
                    criticalCount:
                      type: integer
                    highCount:
                      type: integer
                    lowCount:
                      type: integer
                    mediumCount:
                      type: integer
                    noneCount:
                      type: integer
                    unknownCount:
                      type: integer
                updateTimestamp:
                  type: string
                  format: date-time
                os:
                  type: object
                  properties:
                    family:
                      type: string
                    name:
                      type: string
                    eosl:
                      type: boolean
                vulnerabilities:
                  type: array
                  items:
                    type: object
                    required:
                      - vulnerabilityID
                      - resource
                      - severity
                      - title
                    properties:
                      vulnerabilityID:
                        type: string
                      resource:
                        type: string
                      installedVersion:
                        type: string
                      fixedVersion:
                        type: string
                      severity:
                        type: string
                        enum:
                          - CRITICAL
                          - HIGH
                          - MEDIUM
                          - LOW
                          - UNKNOWN
                      title:
                        type: string
                      description:
                        type: string
                      primaryLink:
                        type: string
                      links:
                        type: array
                        items:
                          type: string
                      score:
                        type: number
                      target:
                        type: string
                      class:
                        type: string
                      packageType:
                        type: string
                      pkgPath:
                        type: string
                      publishedDate:
                        type: string
                        format: date-time
                      lastModifiedDate:
                        type: string
                        format: date-time
---
